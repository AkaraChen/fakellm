name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: tjs-sys/fetch-sources.sh # txiki.js is embedded in the binary: its git submodules are part of the build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6 # tests/python_sdk.rs fails under CI=true without uv
      # tests/node_sdk.rs fails (instead of skipping) under CI=true when these are missing
      - run: npm ci && npm run build
        working-directory: sdk/js
      - run: npm ci
        working-directory: sdk/node
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The crate has cfg(unix) fallbacks (RST, signals); this only proves it compiles on the other hosts. The embedded
  # txiki.js (feature `tjs`) builds on Linux and macOS only, so Windows checks the crate without it.
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: ""
          - os: windows-latest
            flags: --no-default-features
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: tjs-sys/fetch-sources.sh # the embedded txiki.js builds from git submodules (not on Windows, which checks without it)
        if: runner.os != 'Windows'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check ${{ matrix.flags }}

  # A build without the embedded txiki.js: policies then need node (or bun) on PATH, and no cmake or submodules are involved.
  no-tjs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test --no-default-features --lib --test policy --test policy_protocols --test snapshots --test watch --test bin

  node:
    runs-on: ubuntu-24.04
    env:
      FAKELLM_BIN: ${{ github.workspace }}/target/debug/fakellm
    steps:
      - uses: actions/checkout@v7
      - run: tjs-sys/fetch-sources.sh # txiki.js is embedded in the binary: its git submodules are part of the build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: cargo build
      - run: npm ci && npm run build
        working-directory: sdk/js
      - run: npm ci
        working-directory: sdk/node
      - run: npm test
        working-directory: sdk/js
      - run: bun test
        working-directory: sdk/js
      - run: npm test
        working-directory: sdk/node
      # bun runs the node:test files unchanged
      - run: bun test
        working-directory: sdk/node

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: tjs-sys/fetch-sources.sh # txiki.js is embedded in the binary: its git submodules are part of the build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - run: cargo build
      - run: go vet ./...
        working-directory: go
      - run: go test ./...
        working-directory: go
        env:
          FAKELLM_BIN: ${{ github.workspace }}/target/debug/fakellm

  napi-bun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: tjs-sys/fetch-sources.sh # txiki.js is embedded in the binary: its git submodules are part of the build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node
      - uses: oven-sh/setup-bun@v2
      # the Node build and test matrix is in node.yml; this checks the addon loads under Bun
      - run: bun install
        working-directory: bindings/node
      - run: bun run build:debug
        working-directory: bindings/node
      - run: bun test
        working-directory: bindings/node

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: tjs-sys/fetch-sources.sh # txiki.js is embedded in the binary: its git submodules are part of the build
      - run: ./e2e/docker.sh

  python:
    runs-on: ubuntu-24.04
    env:
      FAKELLM_BIN: ${{ github.workspace }}/target/debug/fakellm
    steps:
      - uses: actions/checkout@v7
      - run: tjs-sys/fetch-sources.sh # txiki.js is embedded in the binary: its git submodules are part of the build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo build
      - run: uv run --frozen pytest -q
        working-directory: sdk/python
