name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo build
      - run: npm ci
        working-directory: sdk/node
      - run: npm test
        working-directory: sdk/node
        env:
          FAKELLM_BIN: ${{ github.workspace }}/target/debug/fakellm

  bun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: cargo build
      - run: bun install
        working-directory: sdk/node
      # bun test runs the node:test files unchanged
      - run: bun test
        working-directory: sdk/node
        env:
          FAKELLM_BIN: ${{ github.workspace }}/target/debug/fakellm
