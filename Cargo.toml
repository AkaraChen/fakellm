[package]
name = "fakellm"
version = "0.1.0"
edition = "2024"
description = "An in-memory, OpenAI-compatible LLM API server for tests"
license = "MIT"
repository = "https://github.com/AkaraChen/fakellm"

[dependencies]
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
form_urlencoded = "1.2"
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
mimalloc = "0.1"
parking_lot = "0.13"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
