[package]
name = "fakellm"
version = "0.1.0"
edition = "2024"
description = "An in-memory, OpenAI-compatible LLM API server for tests"
license = "MIT"
repository = "https://github.com/AkaraChen/fakellm"
homepage = "https://github.com/AkaraChen/fakellm"
documentation = "https://docs.rs/fakellm"
readme = "README.md"
keywords = ["llm", "openai", "testing", "mock", "anthropic"]
categories = ["development-tools::testing", "web-programming::http-server"]
rust-version = "1.95"
exclude = [
    "/sdk",
    "/bindings",
    "/go",
    "/e2e",
    "/examples",
    "/target",
    "/.github",
    "/Dockerfile",
    "/tests/node_sdk.rs",
    "/tjs-sys",
    "/third_party",
]

[workspace]
members = [".", "tjs-sys"]

[features]
default = ["tjs"]
# Embeds txiki.js (QuickJS + libuv) so policy scripts run in-process and the binary needs no JavaScript runtime. Needs cmake, a C and a
# C++ compiler, and the git submodules of third_party/txiki.js at build time (see tjs-sys/build.rs). Without it, policies need `node` or `bun`.
tjs = ["dep:tjs-sys"]

[dependencies]
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
fancy-regex = "0.20.0"
form_urlencoded = "1.2"
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "client-legacy", "http1"] }
mimalloc = "0.1"
parking_lot = "0.13"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tjs-sys = { path = "tjs-sys", optional = true }
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
